<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAWD-101 AUDIO AND VIDEO</title>

    <style>
        body {
    background-image:url("game-background-4956017_1920.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    height: 100vh;
     font-family: 'Comic Sans MS';
            margin: 0;
            padding: 20px;
}
       
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #6e00fd;
            text-shadow: 2px 2px 4px #cccccc;
            font-size: 36px;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-box {
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            border: 3px dashed #e76fff;
        }
        
        .box-title {
            text-align: center;
            color: #e44af8;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        video {
            width: 100%;
            height: 200px;
            background-color: #000;
            border-radius: 10px;
            border: 2px solid #45b7d1;
        }
        
        .audio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .audio-box {
            background: linear-gradient(145deg, #fb85ff, #10e2f1);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            border: 3px dotted #a200ff;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .audio-title {
            text-align: center;
            color: #2d3436;
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .credit {
            text-align: center;
            margin-top: 30px;
            color: #636e72;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌VIDEO AND AUDIO PLAYER🌌</h1>
        
        <div class="video-grid">
            <div class="video-box">
            <div class="box-title">Kobe Aya-ay</div>
            <video controls>
            <source src="KOBE AYA-AY.mp4" type="video/mp4">
                   


                </video>
            </div>


            
            <div class="video-box">
             <div class="box-title">Carl Bautista</div>
             <video controls>
            <source src="DOOM CARL.mp4" type="video/mp4">
                   


                </video>


            </div>


            
            <div class="video-box">
            <div class="box-title">Irish De Jesus</div>
            <video controls>
            <source src="IRISH.mp4" type="video/mp4">
                   
                </video>


            </div>


            
            <div class="video-box">
                <div class="box-title">Explanation</div>
                <video controls>
                    <source src="NFS CARL.mp4" type="video/mp4">
                   
                </video>


            </div>
        </div>
        


        <div class="audio-grid">
            <div class="audio-box">
                <div class="audio-title">Keshi-Understand(Kobe)</div>
                <audio controls>
                    <source src="keshi - UNDERSTAND (Official Music Video).mp3" type="audio/mpeg">
                    


                </audio>
            </div>
            


            <div class="audio-box">
                <div class="audio-title">Mac Demarco-For the First Time(Carl)</div>
                <audio controls>
                    <source src="For the First Time.mp3" type="audio/mpeg">
                   


                </audio>
            </div>
            


            <div class="audio-box">
                <div class="audio-title">Blacklite District-Goodbye(Irish)</div>
                <audio controls>
                    <source src="Blacklite District - Goodbye.mp3" type="audio/mpeg">
                  


                </audio>
            </div>

            
            <div class="audio-box">
                <div class="audio-title">Fantastic Audio?</div>
                <audio controls>
                     <source src="90210 - Travis Scott (Best Part, Sped Up And Looped).mp3" type="audio/mpeg">
                     </audio>
                     </div>
                     </div>
                     </div>
                     </body>
                     </html>
